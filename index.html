<!DOCTYPE html>
<html data-color-scheme="light" lang="en">
 <head>
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700;800&amp;family=Inter:wght@300;400;500;600;700;800&amp;family=JetBrains+Mono:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
  <meta charset="utf-8"/>
  <meta content="IE=edge" http-equiv="X-UA-Compatible"/>
  <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
  <title>
   Unified Workflow &amp; Strategic Initiatives – Portfolio Dashboard
  </title>
  <link href="style.css" rel="stylesheet"/>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"/>
  
  
  
  
 </head>
 <body>
<div id="kb-app-nav" style="display:flex;align-items:center;gap:.6rem;flex-wrap:wrap;padding:.5rem 1rem;background:#181b21;color:#e5e7eb;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;font-size:13px;border-bottom:1px solid #2a2e37;position:relative;z-index:99999;box-sizing:border-box;">
  <a href="https://kareembullard.github.io/" style="color:#e5e7eb;text-decoration:none;font-weight:600;white-space:nowrap;">🏠 Home</a>
  <div style="position:relative;">
    <button id="kb-apps-btn" type="button" style="background:#2563eb;color:#fff;border:none;border-radius:6px;padding:.3rem .7rem;font:inherit;cursor:pointer;">Apps ▾</button>
    <div id="kb-apps-menu" style="display:none;position:absolute;top:130%;left:0;background:#181b21;border:1px solid #2a2e37;border-radius:8px;padding:.4rem;min-width:260px;max-height:70vh;overflow-y:auto;box-shadow:0 8px 24px rgba(0,0,0,.45);"></div>
  </div>
  <span id="kb-current-app" style="color:#9aa1ad;white-space:nowrap;"></span>
</div>
<script>
(function () {
  var KB_APPS = [
    { group: "Personal Systems Suite", name: "Systems Catalog Explorer", repo: "systems-catalog-explorer-web" },
    { group: "Personal Systems Suite", name: "Tool Inventory Browser", repo: "tool-inventory-browser-web" },
    { group: "Personal Systems Suite", name: "Snippet & Shortcut Launcher", repo: "snippet-launcher-web" },
    { group: "Personal Systems Suite", name: "Product / Income Calculator", repo: "product-income-calculator-web" },
    { group: "Personal Systems Suite", name: "Food Inventory", repo: "food-inventory-web" },
    { group: "Personal Systems Suite", name: "Quick Capture", repo: "quick-capture-web" },
    { group: "Quizzes & Utilities", name: "Quiz Arcade", repo: "powerbi-quiz" },
    { group: "Quizzes & Utilities", name: "AI Studio Renamer", repo: "ai-studio-renamer" },
    { group: "Project Dashboards", name: "PM Dashboard", repo: "pm-dashboard" },
    { group: "Project Dashboards", name: "Portfolio Dashboard", repo: "portfolio-dashboard" },
    { group: "Project Dashboards", name: "WBS Portfolio", repo: "wbs-portfolio" },
    { group: "Project Dashboards", name: "Sacrifice Metrics", repo: "sacrifice-metrics" },
    { group: "Showcase Demos", name: "Asset Management System", repo: "asset-hub-web" },
    { group: "Showcase Demos", name: "Project Portfolio Manager", repo: "project-portfolio-manager-web" },
    { group: "Showcase Demos", name: "Agile Sprint Manager", repo: "sprint-planner-web" },
    { group: "Showcase Demos", name: "Property Risk Manager", repo: "landlord-risk-manager-web" },
    { group: "Showcase Demos", name: "Learning & Media Tracker", repo: "learning-hub-web" },
    { group: "Showcase Demos", name: "AI Business Framework", repo: "ai-wealth-framework-web" },
    { group: "Showcase Demos", name: "RSS Feed Reader", repo: "rss-feed-reader-web" },
    { group: "Showcase Demos", name: "Personal Growth Tracker", repo: "flourishing-life-web" },
    { group: "Showcase Demos", name: "Phase System Manager", repo: "phase-system-manager-web" },
  ];
  var CURRENT_REPO = "wbs-portfolio";

  var current = KB_APPS.find(function (a) { return a.repo === CURRENT_REPO; });
  var currentSpan = document.getElementById("kb-current-app");
  if (current && currentSpan) currentSpan.textContent = "— " + current.name;

  var menu = document.getElementById("kb-apps-menu");
  var groups = {};
  KB_APPS.forEach(function (a) {
    (groups[a.group] = groups[a.group] || []).push(a);
  });
  Object.keys(groups).forEach(function (g) {
    var h = document.createElement("div");
    h.textContent = g;
    h.style.cssText = "color:#6b7280;font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.04em;padding:.4rem .5rem .2rem;";
    menu.appendChild(h);
    groups[g].forEach(function (a) {
      var isCurrent = a.repo === CURRENT_REPO;
      var link = document.createElement(isCurrent ? "span" : "a");
      link.textContent = (isCurrent ? "● " : "") + a.name;
      if (!isCurrent) link.href = "https://kareembullard.github.io/" + a.repo + "/";
      link.style.cssText = "display:block;padding:.35rem .5rem;border-radius:5px;text-decoration:none;font-size:13px;" +
        (isCurrent ? "color:#60a5fa;font-weight:600;" : "color:#e5e7eb;");
      if (!isCurrent) {
        link.addEventListener("mouseenter", function () { link.style.background = "#242832"; });
        link.addEventListener("mouseleave", function () { link.style.background = "transparent"; });
      }
      menu.appendChild(link);
    });
  });

  var btn = document.getElementById("kb-apps-btn");
  btn.addEventListener("click", function (e) {
    e.stopPropagation();
    menu.style.display = menu.style.display === "block" ? "none" : "block";
  });
  document.addEventListener("click", function () { menu.style.display = "none"; });
})();
</script>

  <!-- Header -->
  <header class="header flex items-center px-16" id="header">
   <h1 class="header__title">
    Unified Workflow &amp; Strategic Initiatives
   </h1>
   <button aria-label="Toggle dark mode" class="btn btn--secondary" id="dark-toggle">
    🌙
   </button>
  </header>
  <!-- Sidebar Navigation -->
  <nav aria-label="Main navigation" class="side-nav nav-bar" id="sidebar">
   <form class="sidebar__form flex gap-8" id="navForm">
    <label class="sidebar__radio">
     <input checked="" name="view" type="radio" value="home"/>
     Home / Project Wiki
    </label>
    <label class="sidebar__radio">
     <input name="view" type="radio" value="wbs"/>
     WBS Dashboard
    </label>
    <label class="sidebar__radio">
     <input name="view" type="radio" value="dictionary"/>
     WBS Dictionary
    </label>
    <label class="sidebar__radio">
     <input name="view" type="radio" value="tasks"/>
     Task Tracker
    </label>
    <label class="sidebar__radio">
     <input name="view" type="radio" value="assets"/>
     Asset Catalog
    </label>
    <label class="sidebar__radio">
     <input name="view" type="radio" value="reporting"/>
     Reporting Forms
    </label>
    <label class="sidebar__radio">
     <input name="view" type="radio" value="knowledge"/>
     Knowledge Library
    </label>
   </form>
  </nav>
  <!-- Main Content -->
  <main class="main" id="main">
   <!-- Home / Wiki View -->
   <section class="view-section section-container" id="view-home">
    <h2 class="section-title">
     Project Overview
    </h2>
    <div class="card" id="homeContent">
     <div class="card__body" id="homeBody">
     </div>
    </div>
   </section>
   <!-- WBS Dashboard -->
   <section class="view-section section-container hidden" id="view-wbs">
    <h2 class="section-title">
     Work Breakdown Structure
    </h2>
    <div class="flex gap-16">
     <div class="card" style="min-width:280px;flex:1;">
      <div class="card__body">
       <ul class="wbs-tree" id="wbsTree">
       </ul>
      </div>
     </div>
     <div class="card" style="flex:2;">
      <div class="card__body" id="wbsDetail">
       <p>
        Select a WBS element to view its details.
       </p>
      </div>
     </div>
    </div>
   </section>
   <!-- WBS Dictionary -->
   <section class="view-section section-container hidden" id="view-dictionary">
    <h2 class="section-title">
     WBS Dictionary
    </h2>
    <div class="flex gap-16 mb-8">
     <input class="form-control" id="dictSearch" placeholder="Search element or description" style="flex:2;" type="text"/>
     <select class="form-control" id="tagFilter" multiple="" style="flex:1;">
     </select>
    </div>
    <div class="card">
     <div class="card__body">
      <table class="table" id="dictTable">
      </table>
     </div>
    </div>
   </section>
   <!-- Task Tracker -->
   <section class="view-section section-container hidden" id="view-tasks">
    <div class="flex items-center mb-8">
     <h2 class="section-title">
      Task Tracker
     </h2>
     <button class="btn btn--primary btn--sm" id="addTaskBtn">
      Add Task
     </button>
    </div>
    <div class="card">
     <div class="card__body">
      <table class="table" id="taskTable">
      </table>
     </div>
    </div>
   </section>
   <!-- Asset Catalog -->
   <section class="view-section section-container hidden" id="view-assets">
    <h2 class="section-title">
     Asset Catalog
    </h2>
    <div class="flex gap-16 mb-8 items-center">
     <input id="fileUpload" multiple="" type="file"/>
    </div>
    <div class="card">
     <div class="card__body">
      <table class="table" id="fileTable">
      </table>
     </div>
    </div>
   </section>
   <!-- Reporting Forms -->
   <section class="view-section section-container hidden" id="view-reporting">
    <h2 class="section-title">
     Status Reporting
    </h2>
    <div class="card mb-16">
     <div class="card__body">
      <form class="flex gap-16" id="reportForm">
       <div class="flex gap-16">
        <div>
         <label class="form-label" for="reportWBS">
          WBS ID
         </label>
         <select class="form-control" id="reportWBS">
         </select>
        </div>
        <div>
         <label class="form-label" for="reportStatus">
          Status Update
         </label>
         <textarea class="form-control" id="reportStatus" rows="3"></textarea>
        </div>
       </div>
       <div class="flex gap-16">
        <div>
         <label class="form-label" for="reportRisks">
          Risks
         </label>
         <textarea class="form-control" id="reportRisks" rows="3"></textarea>
        </div>
        <div>
         <label class="form-label" for="reportActions">
          Next Actions
         </label>
         <textarea class="form-control" id="reportActions" rows="3"></textarea>
        </div>
       </div>
       <div class="flex">
        <button class="btn btn--primary" type="submit">
         Submit Report
        </button>
       </div>
      </form>
     </div>
    </div>
    <div class="card">
     <div class="card__body">
      <table class="table" id="reportTable">
      </table>
     </div>
    </div>
   </section>
   <!-- Knowledge Library -->
   <section class="view-section section-container hidden" id="view-knowledge">
    <h2 class="section-title">
     Knowledge Library
    </h2>
    <div class="flex gap-16 mb-8">
     <select class="form-control" id="pageSelect" style="flex:1;">
     </select>
     <button class="btn btn--primary btn--sm" id="saveWiki">
      Save
     </button>
    </div>
    <textarea class="form-control mb-16" id="wikiEditor" placeholder="Write markdown here..." rows="8"></textarea>
    <div class="card">
     <div class="card__body" id="wikiDisplay">
     </div>
    </div>
   </section>
  </main>
  <script src="app.js">
  </script>
 </body>
</html>
